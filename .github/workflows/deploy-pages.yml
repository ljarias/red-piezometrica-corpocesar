name: Publicar Red Piezométrica

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Validar sintaxis JSON
        run: |
          python -m json.tool data/generated/master.json > /dev/null
          python -m json.tool data/generated/measurements.json > /dev/null
          python -m json.tool data/generated/quality.json > /dev/null
          python -m json.tool data/generated/meta.json > /dev/null

      - name: Ejecutar pruebas de contrato
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validar frontend
        run: python scripts/validate_frontend.py

      - name: Validar privacidad del dataset público
        run: python scripts/validate_public_data.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

name: Publicar Red Piezométrica

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar dependencias frontend verificadas
        run: python scripts/vendor_frontend.py

      - name: Validar sintaxis JSON
        run: |
          python -m json.tool data/generated/master.json > /dev/null
          python -m json.tool data/generated/measurements.json > /dev/null
          python -m json.tool data/generated/quality.json > /dev/null
          python -m json.tool data/generated/meta.json > /dev/null

      - name: Ejecutar pruebas de contrato
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validar frontend
        run: python scripts/validate_frontend.py

      - name: Validar contraste WCAG
        run: python scripts/validate_contrast.py

      - name: Validar privacidad del dataset público
        run: python scripts/validate_public_data.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: "."

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

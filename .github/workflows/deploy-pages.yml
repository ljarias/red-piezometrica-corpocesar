name: Publicar Red Piezométrica

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validar cadena de suministro P08
        run: python scripts/validate_supply_chain.py

      - name: Comprobar sintaxis del frontend
        run: node --check assets/app.js

      - name: Probar popup seguro contra HTML hostil
        run: node --test tests/test_p08_popup_dom.cjs

      - name: Preparar dependencias frontend verificadas
        run: python scripts/vendor_frontend.py

      - name: Validar sintaxis JSON
        run: |
          python -m json.tool data/generated/master.json > /dev/null
          python -m json.tool data/generated/measurements.json > /dev/null
          python -m json.tool data/generated/quality.json > /dev/null
          python -m json.tool data/generated/meta.json > /dev/null

      - name: Ejecutar pruebas de contrato
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validar frontend
        run: python scripts/validate_frontend.py

      - name: Validar contraste WCAG
        run: python scripts/validate_contrast.py

      - name: Validar hardening XSS y URLs
        run: python scripts/validate_security_frontend.py

      - name: Validar privacidad del dataset público
        run: python scripts/validate_public_data.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0 · Node 24

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 · Node 24 transitivo
        with:
          path: "."

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 · Node 24
